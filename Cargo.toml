[package]
name = "auto-editor"
version = "0.1.0"
edition = "2021"
authors = ["Brandon Hubbard <bhubbard@users.noreply.github.com>"]
description = "High-performance, pure Rust port of Auto-Editor — automatic video and audio editing by acoustic loudness, motion analysis, and NLE timeline export."
license = "Unlicense OR MIT"
repository = "https://github.com/bhubbard/auto-editor-rs"
homepage = "https://code.brandonhubbard.com/auto-editor-rs/"
documentation = "https://code.brandonhubbard.com/auto-editor-rs/"
readme = "README.md"
keywords = ["video-editing", "auto-editor", "nle", "audio-processing", "fcpxml"]
categories = ["multimedia::video", "multimedia::audio", "command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
num-rational = { version = "0.4", features = ["serde"] }
regex = "1.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.13"

[[bin]]
name = "auto-editor"
path = "src/main.rs"

[lib]
name = "auto_editor"
path = "src/lib.rs"
